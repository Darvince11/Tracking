databases:
  - name: nexoratel-db
    plan: starter
    databaseName: nexoratel
    user: nexoratel
services:
  - type: web
    name: nexoratel-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: nexoratel-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: RUN_CRON
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: nexoratel-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
